<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.I.A Special User Section</title>
    <link rel="icon" type="image/png" href="Logo.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="banner-container">
        <img src="B.jpg" alt="Background">
        <div class="banner-gradient"></div>
    </div>

    <div class="main-content">

        <div class="logo-wrapper">
            <img src="Logo.jpg" alt="R.I.A Logo">
        </div>

        <div class="titles-wrapper">
            <p class="developer-text">Developer: Semp</p>
            <h1 class="main-title">Special User</h1>
            <p class="subtitle-text">Section</p>
        </div>

        <div class="form-container">
            <div class="input-group-wrapper">
                <div class="input-inner-box">
                    <label for="pinInput" class="input-label">User ID:</label>

                    <div class="input-field">
                        <input
                            type="password"
                            id="pinInput"
                            maxlength="4"
                            inputmode="numeric"
                            placeholder="Please enter your Last 4-digit here..."
                            class="pin-input"
                            autocomplete="off"
                        >
                        <button type="button" id="togglePin" class="toggle-btn" aria-label="Show PIN" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <p id="errorMsg" class="error-message"></p>
            </div>
        </div>

        <button id="loginBtn" class="login-btn">Login</button>
    </div>

    <div class="back-nav-container">
        <button id="backBtn" class="back-btn">
            <span class="back-icon-circle">&lt;</span>
            <span class="back-text">Back</span>
        </button>
    </div>

    <div id="loadingModal" class="loading-modal">
        <div class="loading-card">
            <div class="spinner"></div>
            <p class="loading-title">Verifying credentials...</p>
            <p class="loading-subtitle">Please wait securely</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
